name: "React Workflow"
on: 
  push:
  pull_request:
    # branches:
    #   - main
    #   - dev
    #   - qa
jobs:
  Lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout all 
        uses: actions/checkout@v4

      - name: setup js in vm
        uses: actions/setup-node@v4  
        with:
          node-version: 24
          cache: npm  
        
      - name: install dependencies
        run: npm ci 

      - name: esLinting checkout
        run: npm run lint 

      - name: test case
        run: npm run test   
        
      - name: make react build
        run: npm run build 

      - name: create artifacts
        uses: actions/upload-artifact@v4
        with:
            name: react build
            path: dist/
            retention-days: 7
                
  Test-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout all 
        uses: actions/checkout@v4

      - name: setup js in vm
        uses: actions/setup-node@v4  
        with:
          node-version: 24
          cache: npm  
        
      - name: install dependencies
        run: npm ci  

      - name: test case
        run: npm run test   
  
  Build-job:
    needs: [ Lint-job , Test-job ]
    runs-on: ubuntu-latest
    steps:
      - name: checkout all 
        uses: actions/checkout@v4

      - name: setup js in vm
        uses: actions/setup-node@v4  
        with:
          node-version: 24
          cache: npm  
        
      - name: install dependencies
        run: npm ci    
        
      - name: make react build
        run: npm run build 

      - name: create artifacts
        uses: actions/upload-artifact@v4
        with:
            name: react build
            path: dist/
            retention-days: 7
                
                              
