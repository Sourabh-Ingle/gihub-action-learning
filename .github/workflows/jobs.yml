name: Jobs Test
on: workflow_dispatch
  # workflow_run:
  #   workflows: [First Workflow]
  #   types:
  #     - completed
jobs:
  validation-html:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: Validate html File  
        run: test -f index.html

  validation-js:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: Validate js File  
        run: test -f script.js 

     
  validate-code:
    needs: [validation-html,validation-js]
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: Validate js code
        run: node --check script.js  

      - name: Validate html code
        run: npx htmlhint index.html     


         
